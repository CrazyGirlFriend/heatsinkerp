# No raw URL/query, cookies, referrer or authorization in routine access logs.
log_format safe_access escape=json '{"event":"proxy.request","method":"$request_method","status":$status,"duration":$request_time,"request_id":"$upstream_http_x_request_id"}';

server {
    listen 80;
    listen [::]:80;
    server_name _;
    access_log /var/log/nginx/access.log safe_access;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This is the public edge: discard client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Respect immediate SSE delivery rather than batching inventory updates.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
