target-version = "py311"
line-length = 100

[lint]
select = ["E", "W", "F", "I", "B"]
# Ruff formats to the project's 100-column convention; long SQL, URLs and
# user-facing literals are kept intact rather than split only to meet E501.
ignore = ["E501"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
