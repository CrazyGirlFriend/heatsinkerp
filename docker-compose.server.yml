# Standalone server configuration. Never merge with the local/demo port maps.
# Load credentials from /opt/heatsinkrep/.env using --env-file.
services:
  db:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heatsink_rep}
      MYSQL_USER: ${MYSQL_USER:-heatsink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set a database root password}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: heatsinkrep-backend:${RELEASE_TAG:-latest}
    build:
      context: ./backend
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    restart: unless-stopped
    environment:
      APP_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heatsink_rep}
      MYSQL_USER: ${MYSQL_USER:-heatsink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a database password}
      CORS_ORIGINS: ${APP_ORIGIN:-http://122.200.93.68:8082}
      AUTO_CREATE_TABLES: "false"
      SESSION_TTL_HOURS: 24
      FACTORY_TIMEZONE: Asia/Shanghai
      MAIN_SYSTEM_BASE_URL: ${MAIN_SYSTEM_BASE_URL:-}
      MAIN_SYSTEM_TOKEN: ${MAIN_SYSTEM_TOKEN:-}
      MAIN_SYSTEM_TIMEOUT_SECONDS: ${MAIN_SYSTEM_TIMEOUT_SECONDS:-5}
      MAIN_SYSTEM_CONFIG_KEY: ${MAIN_SYSTEM_CONFIG_KEY:-}
      MAIN_SYSTEM_ALLOWED_ORIGINS: ${MAIN_SYSTEM_ALLOWED_ORIGINS:-}
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Set the administrator password}
      SEED_ADMIN_DISPLAY_NAME: 系统管理员
      SITE_ACCESS_PASSWORD: ${SITE_ACCESS_PASSWORD:?Set the site access password}
      SITE_ACCESS_SECRET: ${SITE_ACCESS_SECRET:?Set a random site access signing secret}
      SITE_ACCESS_SECURE_COOKIE: ${SITE_ACCESS_SECURE_COOKIE:-false}
      # Safe only because the API port is unpublished and the dedicated network
      # contains only this project's services. Nginx supplies the client address.
      FORWARDED_ALLOW_IPS: "*"
      TZ: Asia/Shanghai
    mem_limit: 512m
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # A UI-only release can retain the exact running backend image.
    image: heatsinkrep-frontend:${FRONTEND_RELEASE_TAG:-${RELEASE_TAG:-latest}}
    build:
      context: ./frontend
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-8082}:80"
    mem_limit: 128m
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
