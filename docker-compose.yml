services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heatsink_rep}
      MYSQL_USER: ${MYSQL_USER:-heatsink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-heatsink_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-heatsink_root_dev}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-heatsink_rep}
      MYSQL_USER: ${MYSQL_USER:-heatsink}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-heatsink_dev}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080},http://localhost:5173
      AUTO_CREATE_TABLES: "false"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      FACTORY_TIMEZONE: ${FACTORY_TIMEZONE:-Asia/Shanghai}
      MAIN_SYSTEM_BASE_URL: ${MAIN_SYSTEM_BASE_URL:-}
      MAIN_SYSTEM_TOKEN: ${MAIN_SYSTEM_TOKEN:-}
      MAIN_SYSTEM_TIMEOUT_SECONDS: ${MAIN_SYSTEM_TIMEOUT_SECONDS:-5}
      MAIN_SYSTEM_CONFIG_KEY: ${MAIN_SYSTEM_CONFIG_KEY:-}
      MAIN_SYSTEM_ALLOWED_ORIGINS: ${MAIN_SYSTEM_ALLOWED_ORIGINS:-}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin123!}
      SEED_ADMIN_DISPLAY_NAME: ${SEED_ADMIN_DISPLAY_NAME:-系统管理员}
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
