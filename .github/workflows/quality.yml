name: Code quality and regression

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python scripts/check_backend_quality.py
      - run: python -m pytest -q
        working-directory: backend
      - name: Verify fresh database migration
        working-directory: backend
        env:
          DATABASE_URL: sqlite:////tmp/heatsink-ci-migration.sqlite
        run: python -m alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
        working-directory: .
      - run: npm run api:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --maxWorkers=1 --minWorkers=1
      - run: npm run build
  mysql-transactions:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
          MYSQL_DATABASE: heatsink_refactor_qa
          MYSQL_USER: refactor_qa
          MYSQL_PASSWORD: isolated-refactor-qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://refactor_qa:isolated-refactor-qa@127.0.0.1:3306/heatsink_refactor_qa?charset=utf8mb4
      HEATSINK_TEST_DATABASE_URL: mysql+pymysql://refactor_qa:isolated-refactor-qa@127.0.0.1:3306/heatsink_refactor_qa?charset=utf8mb4
      HEATSINK_ALLOW_DISPOSABLE_MYSQL: '1'
      AUTO_CREATE_TABLES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: >-
          python -m pytest -q tests/test_mysql_stock_transactions.py
          tests/test_team_business.py::test_business_search_uses_historical_names_and_literal_wildcards
          tests/test_team_business.py::test_opening_is_an_immutable_independent_origin_and_idempotent
          tests/test_warehouse_location_locks.py::test_heartbeats_cannot_extend_a_draft_beyond_ten_minutes
          tests/test_team_inventory.py
          tests/test_global_inventory.py
        working-directory: backend
